<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestenliste — Hitler-Attentäter-Spiel</title>
<meta name="description" content="Tafelansicht zum Hitler-Attentäter-Spiel: QR-Code zum Einstieg und Bestenliste der Klasse.">
<link rel="icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/tafel.css">
</head>
<body class="tafel">
  <header class="tafel__kopf">
    <span class="schulmarke schulmarke--klein">
      <img class="schullogo" src="assets/logo.png" alt="">
      <span class="schulname">BBS Papenburg<b>Technik und Wirtschaft</b></span>
    </span>
    <h1 class="tafel__titel">Hitler-Attentäter-Spiel</h1>
    <span class="tafel__zaehler" id="zaehler">0 Ergebnisse</span>
  </header>

  <main class="tafel__raum">
    <section class="tafel__einstieg">
      <h2>Scannen und loslegen</h2>
      <div class="qrfeld" id="qrfeld"></div>
      <p class="qradresse" id="qradresse"></p>
      <p class="leise">Kamera der iPads auf den Code halten, dann auf die eingeblendete Adresse tippen.</p>
    </section>

    <section class="tafel__liste">
      <h2>Bestenliste der Klasse</h2>
      <ol class="rang" id="rang"></ol>
      <p class="leise" id="leerhinweis">Noch keine Ergebnisse. Trage unten das erste ein.</p>
    </section>
  </main>

  <footer class="tafel__fuss">
    <form class="eingabe" id="eingabe" autocomplete="off">
      <label for="ename">Name</label>
      <input id="ename" type="text" maxlength="22" placeholder="Mia K." required>
      <label for="ecode">Ergebnis-Code</label>
      <input id="ecode" type="text" maxlength="14" placeholder="2F8071K2C" spellcheck="false">
      <button class="knopf" type="submit">Eintragen</button>
      <span class="meldung" id="meldung"></span>
    </form>
    <div class="werkzeuge">
      <button class="knopf knopf--leise" id="adresse-aendern">Adresse ändern</button>
      <button class="knopf knopf--leise" id="vollbild">Vollbild</button>
      <button class="knopf knopf--leise" id="leeren">Liste leeren</button>
    </div>
  </footer>

  <script src="assets/qr.js"></script>
  <script src="assets/tafel.js"></script>
</body>
</html>
