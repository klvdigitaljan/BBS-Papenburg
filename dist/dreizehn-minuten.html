<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreizehn Minuten</title>
<meta name="description" content="Interaktives Geschichtsspiel über die sechs bekanntesten Attentate auf Hitler zwischen 1939 und 1944.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* =====================================================================
   Dreizehn Minuten — Gestaltung
   Dunkle Aktenfarben, DIN-nahe Schrift für Beschriftungen,
   Serifenschrift für die Erzählung, Monospace für Daten und Uhrzeiten.
   Das Spiel hat bewusst nur eine (dunkle) Erscheinung.
   ===================================================================== */

:root {
  --tinte:      #0e1013;
  --tinte-tief: #080a0c;
  --flaeche:    #191c21;
  --flaeche-2:  #22262c;
  --linie:      #2f343c;
  --papier:     #e8e5de;
  --gedaempft:  #9aa1aa;
  --messing:    #c8a15a;
  --messing-2:  #e0be7c;
  --oxid:       #b23f36;
  --oxid-tief:  #7d2a24;

  --s1: .35rem; --s2: .7rem; --s3: 1.1rem; --s4: 1.7rem; --s5: 2.6rem;
  --schrift-titel: "Barlow Condensed", "Arial Narrow", sans-serif;
  --schrift-text:  "Source Serif 4", Georgia, "Times New Roman", serif;
  --schrift-daten: "IBM Plex Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--tinte);
  color: var(--papier);
  font-family: var(--schrift-text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* --- Hintergrundszene ------------------------------------------------ */

#szene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--tinte-tief);
}
#szene svg { width: 100%; height: 100%; display: block; }
#szene::after {                      /* Vignette */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(125% 95% at 50% 40%, transparent 38%, rgba(6,8,10,.62) 100%),
    linear-gradient(to bottom, rgba(6,8,10,.5) 0%, transparent 24%, transparent 48%, rgba(6,8,10,.78) 100%);
}
#szene.wechsel svg { animation: einblenden .9s ease both; }

@keyframes einblenden { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }

/* Szenen-Animationen */
.staub  { fill: #d9c9a4; opacity: .16; animation: schweben linear infinite; }
.schnee { fill: #e9eef4; opacity: .5;  animation: fallen  linear infinite; }
@keyframes schweben { from { transform: translate3d(0,20px,0); } to { transform: translate3d(26px,-60px,0); } }
@keyframes fallen   { from { transform: translate3d(0,-120px,0); } to { transform: translate3d(-70px,960px,0); } }
.flackern      { animation: flackern 5.5s ease-in-out infinite; }
@keyframes flackern { 0%,100% { opacity: .9; } 43% { opacity: .74; } 47% { opacity: 1; } 61% { opacity: .8; } }
.suchlicht     { animation: schwenken 17s ease-in-out infinite; }
@keyframes schwenken { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(14deg); } }
.zeiger        { transform-box: fill-box; transform-origin: 50% 92%; animation: ticken 60s steps(60) infinite; }
@keyframes ticken { to { transform: rotate(360deg); } }
.fensterlicht  { animation: flackern 7s ease-in-out infinite; }
.klappe        { animation: puls 4.5s ease-in-out infinite; }
@keyframes puls { 0%,100% { opacity: .3; } 50% { opacity: .8; } }
.dunst         { animation: puls 12s ease-in-out infinite; }

/* --- Grundgerüst ----------------------------------------------------- */

#buehne {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 max(16px, 2.2vw);
}

/* --- Kopfleiste ------------------------------------------------------ */

.hud {
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex-wrap: wrap;
  padding-block: var(--s2);
  border-bottom: 1px solid rgba(200,161,90,.22);
  font-family: var(--schrift-daten);
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gedaempft);
  background: linear-gradient(to bottom, rgba(8,10,12,.85), rgba(8,10,12,0));
}
.hud[hidden] { display: none; }
.hud__akte { color: var(--messing); font-weight: 500; }
.hud__rest { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }

.zeitleiste { display: flex; align-items: center; gap: 0; flex: 1 1 220px; min-width: 180px; }
.zeitleiste__punkt {
  flex: 1;
  height: 2px;
  background: var(--linie);
  position: relative;
}
.zeitleiste__punkt::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px; height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--linie);
  transition: background .3s, box-shadow .3s;
}
.zeitleiste__punkt.erledigt::after { background: var(--messing); }
.zeitleiste__punkt.aktiv::after {
  background: var(--messing-2);
  box-shadow: 0 0 0 4px rgba(200,161,90,.22);
}

.leben { display: flex; gap: 5px; align-items: center; }
.leben__zeichen {
  width: 9px; height: 9px;
  background: var(--messing);
  transform: rotate(45deg);
  transition: background .25s, transform .25s;
}
.leben__zeichen.weg { background: transparent; border: 1px solid var(--oxid-tief); transform: rotate(45deg) scale(.8); }
.punkte { color: var(--papier); font-variant-numeric: tabular-nums; font-size: .82rem; }
.punkte b { color: var(--messing-2); font-weight: 500; }

/* --- Inhaltsbereich -------------------------------------------------- */

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: var(--s4) var(--s5);
}

/* Auf breiten Bildschirmen steht die Akte links, damit die Kulisse sichtbar bleibt. */
@media (min-width: 1100px) {
  main { justify-content: flex-start; padding-left: min(5vw, 4rem); }
}

.karte {
  width: 100%;
  max-width: 44rem;
  background: rgba(14,16,19,.9);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  border: 1px solid var(--linie);
  border-left: 3px solid var(--messing);
  box-shadow: 0 26px 70px rgba(0,0,0,.6);
  padding: var(--s4);
  animation: auftauchen .45s ease both;
}
@keyframes auftauchen { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.karte--weit { max-width: 54rem; }

.eyebrow {
  font-family: var(--schrift-daten);
  font-size: .7rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--messing);
  margin: 0 0 var(--s2);
  display: flex;
  gap: var(--s2);
  flex-wrap: wrap;
}
.eyebrow span:not(:first-child) { color: var(--gedaempft); }

h1, h2, h3 {
  font-family: var(--schrift-titel);
  font-weight: 600;
  line-height: 1.03;
  text-wrap: balance;
  margin: 0 0 var(--s2);
  letter-spacing: .005em;
}
h1 { font-size: clamp(2.8rem, 9vw, 5rem); text-transform: uppercase; }
h2 { font-size: clamp(1.7rem, 4.4vw, 2.6rem); }
h3 { font-size: 1.25rem; text-transform: uppercase; letter-spacing: .06em; }

p { margin: 0 0 var(--s3); max-width: 62ch; }
.lage { color: var(--papier); }
.leise { color: var(--gedaempft); }
strong { color: var(--messing-2); font-weight: 600; }

.frage {
  font-family: var(--schrift-titel);
  font-size: clamp(1.35rem, 3.2vw, 1.9rem);
  color: var(--papier);
  margin: var(--s3) 0 var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid var(--linie);
  text-wrap: balance;
}

/* --- Entscheidungen -------------------------------------------------- */

.optionen { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; list-style: none; }

.option {
  display: grid;
  grid-template-columns: 2rem 1fr;
  gap: var(--s2);
  align-items: start;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--papier);
  background: var(--flaeche);
  border: 1px solid var(--linie);
  padding: .8rem .95rem;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .18s;
}
.option:hover:not(:disabled) { background: var(--flaeche-2); border-color: rgba(200,161,90,.55); transform: translateX(3px); }
.option:focus-visible { outline: 2px solid var(--messing-2); outline-offset: 2px; }
.option:disabled { cursor: default; opacity: .55; }
.option__nr {
  font-family: var(--schrift-daten);
  font-size: .78rem;
  color: var(--messing);
  border: 1px solid var(--linie);
  text-align: center;
  padding: .1rem 0;
  line-height: 1.35;
}
.option.richtig { border-color: var(--messing); background: rgba(200,161,90,.13); opacity: 1; }
.option.richtig .option__nr { border-color: var(--messing); color: var(--messing-2); }
.option.falsch { border-color: var(--oxid-tief); background: rgba(178,63,54,.12); animation: ruckeln .3s; }
@keyframes ruckeln { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* --- Rückmeldung ----------------------------------------------------- */

.rueckmeldung {
  margin-top: var(--s3);
  border-top: 1px solid var(--linie);
  padding-top: var(--s3);
  animation: auftauchen .35s ease both;
}
.marke {
  display: inline-block;
  font-family: var(--schrift-daten);
  font-size: .66rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  padding: .18rem .5rem;
  margin-bottom: var(--s2);
}
.marke--ok   { color: var(--tinte); background: var(--messing); }
.marke--nein { color: var(--papier); background: var(--oxid-tief); }
.quelle {
  font-family: var(--schrift-daten);
  font-size: .74rem;
  line-height: 1.5;
  color: var(--gedaempft);
  border-left: 2px solid var(--linie);
  padding-left: var(--s2);
  margin-top: var(--s3);
}

/* --- Knöpfe ---------------------------------------------------------- */

.knopfreihe { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); align-items: center; }
.knopf {
  font-family: var(--schrift-titel);
  font-size: 1.05rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tinte);
  background: var(--messing);
  border: 1px solid var(--messing);
  padding: .5rem 1.4rem;
  cursor: pointer;
  transition: background .18s, transform .18s;
}
.knopf:hover { background: var(--messing-2); transform: translateY(-1px); }
.knopf:focus-visible { outline: 2px solid var(--papier); outline-offset: 2px; }
.knopf--leise { background: transparent; color: var(--messing); }
.knopf--leise:hover { background: rgba(200,161,90,.14); color: var(--messing-2); }

/* --- Startbild ------------------------------------------------------- */

.titelblock { text-align: left; }
.titelblock h1 { color: var(--papier); margin-bottom: var(--s1); }
.untertitel {
  font-family: var(--schrift-titel);
  font-size: clamp(1.05rem, 2.6vw, 1.45rem);
  letter-spacing: .04em;
  color: var(--messing);
  text-transform: uppercase;
  margin-bottom: var(--s3);
}
.regeln { display: grid; gap: var(--s2); margin: var(--s3) 0; padding: 0; list-style: none; }
.regeln li {
  display: grid;
  grid-template-columns: 1.6rem 1fr;
  gap: var(--s2);
  font-size: .95rem;
  color: var(--gedaempft);
}
.regeln b { color: var(--papier); font-weight: 600; }
.regeln .marker { font-family: var(--schrift-daten); color: var(--messing); font-size: .8rem; }

.feld { display: flex; flex-direction: column; gap: var(--s1); margin-top: var(--s3); }
.feld label {
  font-family: var(--schrift-daten);
  font-size: .7rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gedaempft);
}
.feld input {
  font-family: var(--schrift-titel);
  font-size: 1.3rem;
  color: var(--papier);
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-bottom: 2px solid var(--messing);
  padding: .45rem .7rem;
  width: min(100%, 22rem);
}
.feld input:focus-visible { outline: 2px solid var(--messing-2); outline-offset: 2px; }

/* --- Aktenübersicht / Kapitelkarte ----------------------------------- */

.daten {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: var(--s2) var(--s3);
  border-top: 1px solid var(--linie);
  border-bottom: 1px solid var(--linie);
  padding-block: var(--s2);
  margin-bottom: var(--s3);
}
.daten div { display: flex; flex-direction: column; gap: 2px; }
.daten dt, .daten .k {
  font-family: var(--schrift-daten);
  font-size: .66rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gedaempft);
}
.daten .w { font-family: var(--schrift-titel); font-size: 1.05rem; color: var(--papier); }

.fakten { list-style: none; margin: var(--s3) 0 0; padding: 0; display: grid; gap: var(--s2); }
.fakten li {
  display: grid;
  grid-template-columns: 1rem 1fr;
  gap: var(--s2);
  font-size: .95rem;
  color: var(--gedaempft);
}
.fakten li::before { content: "—"; color: var(--messing); }

/* --- Abspann und Rangliste ------------------------------------------- */

.ergebnis {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s4);
  align-items: baseline;
  border-block: 1px solid var(--linie);
  padding-block: var(--s3);
  margin-bottom: var(--s3);
}
.ergebnis__zahl {
  font-family: var(--schrift-titel);
  font-size: clamp(3rem, 12vw, 5.4rem);
  line-height: .9;
  color: var(--messing);
  font-variant-numeric: tabular-nums;
}
.ergebnis__neben { display: grid; gap: var(--s2); }

.zitat {
  font-size: 1.05rem;
  font-style: italic;
  color: var(--papier);
  border-left: 3px solid var(--messing);
  padding-left: var(--s3);
  margin: var(--s3) 0;
  max-width: 60ch;
}
.zitat cite {
  display: block;
  margin-top: var(--s2);
  font-style: normal;
  font-family: var(--schrift-daten);
  font-size: .72rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gedaempft);
}

.tabellenhuelle { overflow-x: auto; margin-top: var(--s3); }
table.rangliste {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--schrift-daten);
  font-size: .82rem;
}
table.rangliste th {
  text-align: left;
  font-weight: 500;
  font-size: .66rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gedaempft);
  border-bottom: 1px solid var(--linie);
  padding: .4rem .6rem .4rem 0;
}
table.rangliste td {
  padding: .42rem .6rem .42rem 0;
  border-bottom: 1px solid rgba(47,52,60,.5);
  font-variant-numeric: tabular-nums;
}
table.rangliste tr.selbst td { color: var(--messing-2); }
table.rangliste td:first-child { color: var(--messing); width: 2.4rem; }

/* --- Kleinkram ------------------------------------------------------- */

.fusszeile {
  font-family: var(--schrift-daten);
  font-size: .66rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #5d646d;
  padding-block: var(--s2) var(--s3);
  display: flex;
  gap: var(--s3);
  flex-wrap: wrap;
}
.tastenhinweis { font-family: var(--schrift-daten); font-size: .68rem; color: #5d646d; letter-spacing: .1em; margin-top: var(--s2); }

@media (max-width: 640px) {
  .karte { padding: var(--s3); }
  .hud { font-size: .62rem; gap: var(--s2); }
  .hud__rest { gap: var(--s2); }
  .zeitleiste { flex-basis: 100%; order: 3; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

</style>
</head>
<body>
<div id="szene" aria-hidden="true"></div>

  <div id="buehne">
    <header class="hud" id="hud" hidden></header>
    <main id="inhalt"></main>
    <footer class="fusszeile">
      <span>Dreizehn Minuten · Unterrichtsspiel</span>
      <span>Elser · Tresckow · Bussche · Kleist · Stieff · Stauffenberg</span>
    </footer>
  </div>

<script>
/*
 * story.js — Inhalte des Spiels "Dreizehn Minuten"
 * Sechs Attentate auf Adolf Hitler, 1939-1944.
 *
 * Regel des Spiels: Die historisch belegte Entscheidung ist die richtige.
 * Wer die Geschichte kennt, kommt durch die Akte.
 */

const STORY = {
  kapitel: [

/* ===================================================================== *
 * I — Georg Elser, 8. November 1939
 * ===================================================================== */
{
  id: "elser",
  nr: "I",
  datum: "8. November 1939",
  kurzdatum: "8.11.1939",
  ort: "Bürgerbräukeller, München",
  person: "Georg Elser, Schreiner",
  szene: "buergerbraukeller",
  akte: "AKTE I / ELSER",
  intro: `Du bist Georg Elser, 36 Jahre alt, Schreiner aus Königsbronn in Württemberg.
  Du bist in keiner Widerstandsgruppe, du hast keine Mitwisser, keine Geldgeber, keinen Auftrag.
  Im Herbst 1938 hast du beschlossen, dass der Krieg nur zu verhindern ist, wenn die Führungsspitze
  verschwindet. Seitdem arbeitest du daran — allein.
  <br><br>Jedes Jahr am 8. November spricht Hitler im Münchner Bürgerbräukeller vor den
  „alten Kämpfern“. Du hast dir die Uhrzeiten der letzten Jahre gemerkt. Du hast einen Plan:
  eine Bombe in der Säule direkt hinter dem Rednerpult.`,
  szenen: [
    {
      lage: `München, August 1939. Du hast den Saal vermessen und die Säule hinter dem Rednerpult
      ausgewählt. Um sie auszuhöhlen, brauchst du über dreißig Nächte in einem verschlossenen Wirtshaus.`,
      frage: "Wie kommst du Nacht für Nacht in den Bürgerbräukeller?",
      optionen: [
        { t: "Abends als normaler Gast essen gehen und dich vor der Sperrstunde in einer Abstellkammer einschließen lassen",
          ok: true,
          fb: `So hat Elser es gemacht. Er aß als Gast zu Abend, verschwand gegen 22 Uhr auf die Empore,
          wartete, bis abgeschlossen war, und arbeitete dann bis zum Morgengrauen. Das Klopfen deckte er
          mit dem Lärm der vorbeifahrenden Straßenbahn ab. Morgens verließ er das Haus, sobald
          aufgeschlossen wurde.` },
        { t: "Nachts ein Kellerfenster aufbrechen",
          ok: false,
          fb: `Einbruchsspuren bedeuten Polizei, und Polizei im Saal bedeutet, dass die Säule untersucht wird.
          Elser hat nie eine Spur hinterlassen — er nahm den Holzstaub jede Nacht in einem Koffer mit hinaus.` },
        { t: "Einen Kellner bestechen, der dich hereinlässt",
          ok: false,
          fb: `Jeder Mitwisser ist ein Risiko. Elsers größte Stärke war, dass er vollkommen allein handelte:
          Die Gestapo konnte später monatelang nicht glauben, dass kein Hintermann existierte.` }
      ],
      quelle: "Elser mietete sich zusätzlich für Wochen in München ein und gab als Beruf „Erfinder“ an."
    },
    {
      lage: `Für die Ladung brauchst du Sprengstoff, Zündkapseln und Zeit. Ein Schreiner kann so etwas
      nicht kaufen — jeder Verkauf würde registriert.`,
      frage: "Woher beschaffst du Sprengstoff und Zünder?",
      optionen: [
        { t: "Du lässt dich im Steinbruch und in einer Rüstungsfabrik anstellen und entwendest über Monate kleine Mengen",
          ok: true,
          fb: `Richtig. Elser arbeitete in der Armaturenfabrik Waldenmaier in Heidenheim — dort gab es
          Pressspäne und Zünderteile — und danach im Steinbruch Königsbronn, wo er über Wochen
          Sprengpatronen und Zündkapseln beiseiteschaffte. Kleine Mengen, nie auffällig.` },
        { t: "Du kaufst auf dem Schwarzmarkt in München",
          ok: false,
          fb: `Der Schwarzmarkt ist voller Spitzel, und Sprengstoff in dieser Menge ist meldepflichtig.
          Elser hat nie jemanden gefragt — genau deshalb kam ihm niemand auf die Spur.` },
        { t: "Du brichst in ein Wehrmachtsdepot ein",
          ok: false,
          fb: `Ein Depotdiebstahl löst sofort eine reichsweite Fahndung aus. Elsers Methode war das Gegenteil:
          unsichtbar bleiben, Monate Zeit nehmen, nichts erzwingen.` }
      ],
      quelle: "Elser baute den Sprengsatz in seiner Werkstatt und testete die Zündung auf einer Wiese bei Königsbronn."
    },
    {
      lage: `Der Zünder ist fertig: zwei Uhrwerke, die bis zu 144 Stunden vorlaufen können.
      Du musst die Uhr jetzt stellen — Tage im Voraus, ohne zu wissen, wie der Abend genau verläuft.`,
      frage: "Auf welche Uhrzeit stellst du den Zünder für den 8. November?",
      optionen: [
        { t: "21:20 Uhr — mitten in die Rede hinein",
          ok: true,
          fb: `Genau so. In den Vorjahren hatte Hitler gegen 20:30 Uhr begonnen und rund zwei Stunden
          gesprochen. 21:20 Uhr lag mitten in der Rede. Die Rechnung war völlig richtig — und trotzdem
          falsch, wie sich zeigen wird.` },
        { t: "20:30 Uhr — direkt zum Redebeginn",

/* Hilfsfunktionen ---------------------------------------------------- */

// Deterministischer Zufall, damit eine Szene bei jedem Aufruf gleich aussieht.
function rnd(seed) {
  let s = seed;
  return () => {
    s = (s * 1103515245 + 12345) % 2147483648;
    return s / 2147483648;
  };
}

function partikel(anzahl, seed, klasse, rMin, rMax) {
  const r = rnd(seed);
  let out = "";
  for (let i = 0; i < anzahl; i++) {
    const x = (r() * 1700 - 50).toFixed(1);
    const y = (r() * 900).toFixed(1);
    const rad = (rMin + r() * (rMax - rMin)).toFixed(2);
    const dur = (6 + r() * 14).toFixed(1);
    const delay = (-r() * 20).toFixed(1);
    out += `<circle class="${klasse}" cx="${x}" cy="${y}" r="${rad}"
      style="animation-duration:${dur}s;animation-delay:${delay}s"/>`;
  }
  return out;
}

function baumreihe(y, hoehe, farbe, seed, anzahl) {
  const r = rnd(seed);
  let out = "";
  for (let i = 0; i < anzahl; i++) {
    const x = (i / anzahl) * 1700 - 50 + r() * 40;
    const h = hoehe * (0.6 + r() * 0.7);
    const b = h * (0.22 + r() * 0.12);
    out += `<path d="M${x} ${y} L${x + b} ${y - h * 0.55} L${x + b * 0.45} ${y - h * 0.5}
      L${x + b * 1.05} ${y - h} L${x - b * 1.05} ${y - h} L${x - b * 0.45} ${y - h * 0.5}
      L${x - b} ${y - h * 0.55} Z" fill="${farbe}"/>`;
  }
  return out;
}

/*
 * game.js — Spiellogik für "Dreizehn Minuten"
 *
 * Ablauf: Startbild → je Kapitel (Aktendeckel → Entscheidungsszenen → Epilog) → Abspann.
 * Die historisch belegte Entscheidung ist immer die richtige. Falsche Entscheidungen
 * kosten Punkte und eine der drei Spuren; sind alle drei weg, beginnt das Kapitel neu.
 */

const PUNKTE_PRO_SZENE = 120;
const ABZUG_PRO_FEHLER = 40;
const MINDESTPUNKTE     = 20;
const BONUS_KAPITEL     = 100;   // Kapitel ohne Fehler
const BONUS_AKTE        = 300;   // gesamtes Spiel ohne Fehler
const SPUREN            = 3;
const SPEICHER          = "dreizehn-minuten.rangliste";

const spiel = {
  name: "",
  kapitel: 0,
  szene: 0,
  punkte: 0,
  kapitelPunkte: 0,
  spuren: SPUREN,
  fehler: 0,
  kapitelFehler: 0,
  fehlversuche: 0,     // in der aktuellen Szene
  start: 0,
  lauft: false
};

/* --- Werkzeug -------------------------------------------------------- */

const $ = (sel) => document.querySelector(sel);

function sicher(text) {
  return String(text).replace(/[&<>"']/g, (z) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}

function zeitString(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

function setzeSzene(name) {
  const box = $("#szene");
  box.innerHTML = (SCENES[name] || SCENES.titel)();
  box.classList.remove("wechsel");
  void box.offsetWidth;            // Neustart der Einblend-Animation erzwingen
  box.classList.add("wechsel");
}

function male(html) {
  $("#inhalt").innerHTML = html;
  $("#inhalt").scrollIntoView({ block: "nearest" });
}

/* --- Kopfleiste ------------------------------------------------------ */

function zeichneHud(sichtbar) {
  const hud = $("#hud");
  hud.hidden = !sichtbar;
  if (!sichtbar) return;

  const k = STORY.kapitel[spiel.kapitel];
  const punkte = spiel.punkte + spiel.kapitelPunkte;

  hud.innerHTML = `
    <span class="hud__akte">${k ? sicher(k.akte) : "AKTE"}</span>
    <span class="zeitleiste" role="img" aria-label="Fortschritt: Akte ${spiel.kapitel + 1} von ${STORY.kapitel.length}">
      ${STORY.kapitel.map((_, i) => `<span class="zeitleiste__punkt
        ${i < spiel.kapitel ? "erledigt" : ""} ${i === spiel.kapitel ? "aktiv" : ""}"></span>`).join("")}
    </span>
    <span class="hud__rest">
      <span class="leben" role="img" aria-label="Verbleibende Spuren: ${spiel.spuren} von ${SPUREN}">
        ${Array.from({ length: SPUREN }, (_, i) =>
          `<span class="leben__zeichen ${i < spiel.spuren ? "" : "weg"}"></span>`).join("")}
      </span>
      <span class="punkte">Punkte <b>${punkte}</b></span>
    </span>`;
}

/* --- Startbild ------------------------------------------------------- */

function zeigeStart() {
  setzeSzene("titel");
  zeichneHud(false);
  male(`
    <article class="karte karte--weit titelblock">
      <p class="eyebrow"><span>Geschichte interaktiv</span><span>1939 – 1944</span><span>6 Akten</span></p>
      <h1>Dreizehn<br>Minuten</h1>
      <p class="untertitel">Sechs Attentate auf Hitler — und warum jedes scheiterte</p>
      <p class="lage">Du übernimmst nacheinander die Rolle von sechs Menschen, die versucht haben,
      Hitler zu töten. Vor dir liegen ihre Entscheidungen: über Sprengstoff, Tarnung, Termine,
      über den eigenen Tod. <strong>Historisch richtig entschieden heißt hier: so, wie es damals
      wirklich entschieden wurde.</strong> Wer die Geschichte kennt, kommt durch die Akte —
      und überlebt jedes Attentat genauso, wie Hitler es damals überlebte.</p>
      <ul class="regeln">
        <li><span class="marker">01</span><span><b>Sechs Akten, 24 Entscheidungen.</b> Jede richtige Entscheidung bringt bis zu ${PUNKTE_PRO_SZENE} Punkte.</span></li>
        <li><span class="marker">02</span><span><b>Drei Spuren pro Akte.</b> Jeder Fehlversuch kostet eine Spur und ${ABZUG_PRO_FEHLER} Punkte. Du darfst weiterraten — aber es wird teuer.</span></li>
        <li><span class="marker">03</span><span><b>Sind alle Spuren weg,</b> beginnt die Akte von vorn und die Punkte dieser Akte verfallen.</span></li>
        <li><span class="marker">04</span><span><b>Fehlerfreie Akte:</b> +${BONUS_KAPITEL} Punkte. Fehlerfreies Spiel: +${BONUS_AKTE} Punkte.</span></li>
        <li><span class="marker">05</span><span><b>Nach jeder Entscheidung</b> erfährst du, was wirklich geschah. Lies es — die nächste Akte baut darauf auf.</span></li>
      </ul>
      <div class="feld">
        <label for="name">Name für die Rangliste</label>
        <input id="name" type="text" maxlength="22" placeholder="z. B. Mia K." autocomplete="off">
      </div>
      <div class="knopfreihe">
        <button class="knopf" id="los">Akte I öffnen</button>
        <button class="knopf knopf--leise" id="rangliste-zeigen">Rangliste</button>
      </div>
      <p class="tastenhinweis">Tastatur: 1 – 3 wählt eine Option, Enter blättert weiter.</p>
    </article>`);

  $("#name").value = localStorage.getItem("dreizehn-minuten.name") || "";
  $("#los").addEventListener("click", spielStarten);
  $("#name").addEventListener("keydown", (e) => { if (e.key === "Enter") spielStarten(); });
  $("#rangliste-zeigen").addEventListener("click", () => zeigeRangliste(null));
}

function spielStarten() {
  const name = ($("#name")?.value || "").trim();
  spiel.name = name || "Unbekannt";
  try { localStorage.setItem("dreizehn-minuten.name", spiel.name); } catch (e) { /* Privatmodus */ }
  Object.assign(spiel, {
    kapitel: 0, szene: 0, punkte: 0, kapitelPunkte: 0, spuren: SPUREN,
    fehler: 0, kapitelFehler: 0, fehlversuche: 0, start: Date.now(), lauft: true
  });
  zeigeKapitel();
}

/* --- Aktendeckel ----------------------------------------------------- */

function zeigeKapitel() {
  const k = STORY.kapitel[spiel.kapitel];
  spiel.szene = 0;
  spiel.spuren = SPUREN;
  spiel.kapitelPunkte = 0;
  spiel.kapitelFehler = 0;
  setzeSzene(k.szene);
  zeichneHud(true);
  male(`
    <article class="karte">
      <p class="eyebrow"><span>Akte ${k.nr}</span><span>${sicher(k.datum)}</span><span>${sicher(k.ort)}</span></p>
      <h2>${sicher(k.person.split(",")[0])}</h2>
      <div class="daten">
        <div><span class="k">Datum</span><span class="w">${sicher(k.datum)}</span></div>
        <div><span class="k">Ort</span><span class="w">${sicher(k.ort)}</span></div>
        <div><span class="k">Deine Rolle</span><span class="w">${sicher(k.person)}</span></div>
      </div>
      <p class="lage">${k.intro}</p>
      <div class="knopfreihe"><button class="knopf" id="weiter">Erste Entscheidung</button></div>
    </article>`);
  $("#weiter").addEventListener("click", zeigeSzene);
}

/* --- Entscheidungsszene ---------------------------------------------- */

function zeigeSzene() {
  const k = STORY.kapitel[spiel.kapitel];
  const s = k.szenen[spiel.szene];
  spiel.fehlversuche = 0;
  zeichneHud(true);
  male(`
    <article class="karte">
      <p class="eyebrow">
        <span>Akte ${k.nr} · ${sicher(k.kurzdatum)}</span>
        <span>Entscheidung ${spiel.szene + 1} von ${k.szenen.length}</span>
      </p>
      <p class="lage">${s.lage}</p>
      <p class="frage">${s.frage}</p>
      <ul class="optionen" id="optionen">
        ${s.optionen.map((o, i) => `
          <li><button class="option" data-i="${i}">
            <span class="option__nr">${i + 1}</span>
            <span>${o.t}</span>
          </button></li>`).join("")}
      </ul>
      <div id="rueckmeldung"></div>
    </article>`);

  $("#optionen").addEventListener("click", (e) => {
    const knopf = e.target.closest(".option");
    if (knopf && !knopf.disabled) waehle(Number(knopf.dataset.i));
  });
}

function waehle(i) {
  const k = STORY.kapitel[spiel.kapitel];
  const s = k.szenen[spiel.szene];
  const o = s.optionen[i];
  const knopf = document.querySelector(`.option[data-i="${i}"]`);

  if (o.ok) {
    document.querySelectorAll(".option").forEach((b) => { b.disabled = true; });
    knopf.classList.add("richtig");
    knopf.disabled = true;

    const gewinn = Math.max(MINDESTPUNKTE, PUNKTE_PRO_SZENE - spiel.fehlversuche * ABZUG_PRO_FEHLER);
    spiel.kapitelPunkte += gewinn;
    const letzte = spiel.szene === k.szenen.length - 1;

    $("#rueckmeldung").innerHTML = `
      <div class="rueckmeldung">
        <span class="marke marke--ok">So war es · +${gewinn} Punkte</span>
        <p>${o.fb}</p>
        ${s.quelle ? `<p class="quelle">Quellennotiz: ${s.quelle}</p>` : ""}
        <div class="knopfreihe">
          <button class="knopf" id="weiter">${letzte ? "Akte abschließen" : "Weiter"}</button>
        </div>
      </div>`;
    $("#weiter").addEventListener("click", () => {
      if (letzte) { zeigeEpilog(); } else { spiel.szene++; zeigeSzene(); }
    });
    zeichneHud(true);
    return;
  }

  /* Falsche Entscheidung */
  knopf.classList.add("falsch");
  knopf.disabled = true;
  spiel.fehlversuche++;
  spiel.fehler++;
  spiel.kapitelFehler++;
  spiel.spuren--;
  zeichneHud(true);

  $("#rueckmeldung").innerHTML = `
    <div class="rueckmeldung">
      <span class="marke marke--nein">So war es nicht · eine Spur verloren</span>
      <p>${o.fb}</p>
      ${spiel.spuren > 0
        ? `<p class="leise">Du hast noch ${spiel.spuren} ${spiel.spuren === 1 ? "Spur" : "Spuren"}. Entscheide neu.</p>`
        : `<div class="knopfreihe"><button class="knopf" id="neustart-kapitel">Akte ${k.nr} neu aufrollen</button></div>`}
    </div>`;

  if (spiel.spuren <= 0) {
    document.querySelectorAll(".option").forEach((b) => { b.disabled = true; });
    $("#neustart-kapitel").addEventListener("click", zeigeGescheitert);
  }
}

/* --- Kapitel gescheitert --------------------------------------------- */

function zeigeGescheitert() {
  const k = STORY.kapitel[spiel.kapitel];
  const verfallen = spiel.kapitelPunkte;
  male(`
    <article class="karte">
      <p class="eyebrow"><span>Akte ${k.nr}</span><span>Spur abgerissen</span></p>
      <h2>Die Spur reißt ab</h2>
      <p class="lage">Drei Fehlentscheidungen — in der Wirklichkeit hätte das Verhaftung bedeutet,
      für dich und für alle, die von deinem Plan wussten. Die Akte wird neu aufgerollt.</p>
      <p class="leise">${verfallen} Punkte aus dieser Akte verfallen. Deine bisherigen
      ${spiel.punkte} Punkte aus abgeschlossenen Akten bleiben.</p>
      <div class="knopfreihe"><button class="knopf" id="weiter">Akte ${k.nr} von vorn</button></div>
    </article>`);
  $("#weiter").addEventListener("click", zeigeKapitel);
}

/* --- Epilog eines Kapitels ------------------------------------------- */

function zeigeEpilog() {
  const k = STORY.kapitel[spiel.kapitel];
  let bonus = 0;
  if (spiel.kapitelFehler === 0) { bonus = BONUS_KAPITEL; spiel.kapitelPunkte += bonus; }
  spiel.punkte += spiel.kapitelPunkte;
  spiel.kapitelPunkte = 0;
  zeichneHud(true);

  const letzte = spiel.kapitel === STORY.kapitel.length - 1;
  male(`
    <article class="karte">
      <p class="eyebrow"><span>Akte ${k.nr} · Ausgang</span><span>${sicher(k.kurzdatum)}</span></p>
      <h2>${sicher(k.epilog.titel)}</h2>
      <p class="lage">${k.epilog.text}</p>
      <ul class="fakten">${k.epilog.fakten.map((f) => `<li><span></span><span>${f}</span></li>`).join("")}</ul>
      ${bonus ? `<p class="quelle">Akte ohne Fehlentscheidung abgeschlossen: +${bonus} Punkte.</p>` : ""}
      <div class="knopfreihe">
        <button class="knopf" id="weiter">${letzte ? "Auswertung" : "Akte " + STORY.kapitel[spiel.kapitel + 1].nr + " öffnen"}</button>
        <span class="leise">Punkte gesamt: ${spiel.punkte}</span>
      </div>
    </article>`);
  $("#weiter").addEventListener("click", () => {
    if (letzte) { zeigeFinale(); } else { spiel.kapitel++; zeigeKapitel(); }
  });
}

/* --- Abspann --------------------------------------------------------- */

function zeigeFinale() {
  const dauer = Date.now() - spiel.start;
  let bonus = 0;
  if (spiel.fehler === 0) { bonus = BONUS_AKTE; spiel.punkte += bonus; }
  spiel.lauft = false;
  setzeSzene("bendlerblock");
  zeichneHud(false);

  const eintrag = {
    name: spiel.name,
    punkte: spiel.punkte,
    fehler: spiel.fehler,
    sekunden: Math.round(dauer / 1000),
    datum: new Date().toISOString().slice(0, 10)
  };
  const platz = speichereErgebnis(eintrag);

  male(`
    <article class="karte karte--weit">
      <p class="eyebrow"><span>Auswertung</span><span>${sicher(spiel.name)}</span><span>${eintrag.datum}</span></p>
      <h2>${sicher(STORY.fazit.titel)}</h2>
      <div class="ergebnis">
        <span class="ergebnis__zahl">${spiel.punkte}</span>
        <div class="ergebnis__neben">
          <span class="leise">Punkte · Platz ${platz} in der Rangliste dieses Rechners</span>
          <span class="leise">Fehlentscheidungen: ${spiel.fehler} · Spielzeit: ${zeitString(dauer)}
          ${bonus ? " · Fehlerfrei-Bonus: +" + bonus : ""}</span>
        </div>
      </div>
      <p class="lage">${STORY.fazit.text}</p>
      <blockquote class="zitat">${STORY.fazit.zitat}<cite>${sicher(STORY.fazit.zitatQuelle)}</cite></blockquote>
      <div id="ranglistenbereich"></div>
      <div class="knopfreihe">
        <button class="knopf" id="nochmal">Noch einmal spielen</button>
        <button class="knopf knopf--leise" id="drucken">Ergebnis drucken</button>
      </div>
    </article>`);

  zeichneRangliste($("#ranglistenbereich"), eintrag);
  $("#nochmal").addEventListener("click", zeigeStart);
  $("#drucken").addEventListener("click", () => window.print());
}

/* --- Rangliste ------------------------------------------------------- */

function ladeRangliste() {
  try { return JSON.parse(localStorage.getItem(SPEICHER) || "[]"); }
  catch (e) { return []; }
}

function speichereErgebnis(eintrag) {
  const liste = ladeRangliste();
  eintrag.id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  liste.push(eintrag);
  liste.sort((a, b) => b.punkte - a.punkte || a.sekunden - b.sekunden);
  const gekuerzt = liste.slice(0, 50);
  try { localStorage.setItem(SPEICHER, JSON.stringify(gekuerzt)); } catch (e) { /* Privatmodus */ }
  return gekuerzt.findIndex((e2) => e2.id === eintrag.id) + 1 || "—";
}

function zeichneRangliste(ziel, eigener) {
  const liste = ladeRangliste().slice(0, 10);
  if (!liste.length) {
    ziel.innerHTML = `<p class="leise">Noch keine Ergebnisse auf diesem Rechner.</p>`;
    return;
  }
  ziel.innerHTML = `
    <h3>Rangliste</h3>
    <div class="tabellenhuelle">
      <table class="rangliste">
        <thead><tr><th>Pl.</th><th>Name</th><th>Punkte</th><th>Fehler</th><th>Zeit</th><th>Datum</th></tr></thead>
        <tbody>
          ${liste.map((e, i) => `
            <tr class="${eigener && e.id === eigener.id ? "selbst" : ""}">
              <td>${i + 1}</td>
              <td>${sicher(e.name)}</td>
              <td>${e.punkte}</td>
              <td>${e.fehler}</td>
              <td>${zeitString(e.sekunden * 1000)}</td>
              <td>${sicher(e.datum)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function zeigeRangliste() {
  setzeSzene("titel");
  zeichneHud(false);
  male(`
    <article class="karte karte--weit">
      <p class="eyebrow"><span>Rangliste</span><span>Dieser Rechner</span></p>
      <h2>Wer kam am weitesten durch die Akten?</h2>
      <div id="ranglistenbereich"></div>
      <div class="knopfreihe">
        <button class="knopf" id="zurueck">Zurück</button>
        <button class="knopf knopf--leise" id="loeschen">Rangliste löschen</button>
      </div>
    </article>`);
  zeichneRangliste($("#ranglistenbereich"), null);
  $("#zurueck").addEventListener("click", zeigeStart);
  $("#loeschen").addEventListener("click", () => {
    if (window.confirm("Alle gespeicherten Ergebnisse auf diesem Rechner löschen?")) {
      try { localStorage.removeItem(SPEICHER); } catch (e) { /* Privatmodus */ }
      zeigeRangliste();
    }
  });
}

/* --- Tastatur -------------------------------------------------------- */

document.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.key >= "1" && e.key <= "4") {
    const knopf = document.querySelector(`.option[data-i="${Number(e.key) - 1}"]`);
    if (knopf && !knopf.disabled) { e.preventDefault(); waehle(Number(e.key) - 1); }
  }
  if (e.key === "Enter") {
    const weiter = $("#weiter");
    if (weiter) { e.preventDefault(); weiter.click(); }
  }
});

/* --- Start ----------------------------------------------------------- */

document.addEventListener("DOMContentLoaded", zeigeStart);

</script>
</body>
</html>
